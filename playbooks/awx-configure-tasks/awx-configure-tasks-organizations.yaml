---
- name: "AWX CONFIGURE TASKS ORGANIZATION: Get current organizations"
  ansible.builtin.set_fact:
    current_awx_organizations: "{{ lookup('awx.awx.controller_api', 'organizations') }}"

# - name: "AWX CONFIGURE TASKS ORGANIZATION: Differences in configurations"
