#         {{ [current_awx_organizations.name] }}
#       {% else %}
#         {{ (current_awx_organizations | map(attribute='name') | list) | difference((awx_config.organizations | map(attribute='name') | list)) }}
#       {% endif %}

- name: "AWX CONFIGURE TASKS ORGANIZATION: Configure Organizations"
  awx.awx.organization:
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    instance_groups: "{{ item.instance_groups | default(omit) }}"
    default_environment: "{{ item.execution_environment | default(omit) }}"
    galaxy_credentials: "{{ item.galaxy_credentials | default(omit) }}"
    state: present
  loop: "{{ awx_config.organizations }}"


